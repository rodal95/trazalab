# nginx delante de la consola: sirve la portada con el manual y pasa /consola/ a ttyd.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/nginx-cuerpo;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    server {
        listen PUERTO;
        root /app/web/sitio;
        add_header Cache-Control "no-cache";
        location = /consola { return 301 /consola/; }
        location /consola/ {
            proxy_pass http://unix:/tmp/ttyd.sock:/consola/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
        }
        location = /salud { return 200 "ok\n"; }
    }
}
